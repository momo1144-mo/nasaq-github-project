<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نسق</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f5fa;--card:#fff;--ink:#0f1a30;--mut:#62728c;--line:#dbe3ee;--acc:#0891b2;--accfg:#04202a;--warn:#d9480f;--soft:#e0f4f8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b16;--card:#0f1628;--ink:#e6edf7;--mut:#8493ad;--line:#1e2b47;--acc:#22d3ee;--accfg:#04202a;--warn:#ff7a59;--soft:#0c2a3b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#070b16;--card:#0f1628;--ink:#e6edf7;--mut:#8493ad;--line:#1e2b47;--acc:#22d3ee;--accfg:#04202a;--warn:#ff7a59;--soft:#0c2a3b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;padding-bottom:84px}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;font-weight:800;margin:4px 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.add{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
.add input[type=text]{grid-column:1/-1}
input,select,button{font:inherit;color:inherit}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
button{cursor:pointer;border:0;border-radius:10px}
.btn{background:var(--acc);color:var(--accfg);font-weight:600;padding:10px 16px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;background:var(--card);border:1px solid var(--line);padding:7px;font-size:14px}
.tabs button.on{background:var(--soft);border-color:var(--acc);font-weight:600}
.task{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line)}
.task:last-child{border:0}
.task input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.task .t{flex:1;min-width:0;overflow-wrap:anywhere}
.task.done .t{text-decoration:line-through;color:var(--mut)}
.task small{display:block;color:var(--mut);font-size:12px}
.task small.late{color:var(--warn)}
.del{background:none;color:var(--mut);font-size:20px;padding:2px 8px}
.pri{width:8px;height:30px;border-radius:4px;flex:none}
.empty{color:var(--mut);text-align:center;padding:24px 8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h b{font-size:18px}
.cal-h button{background:var(--card);border:1px solid var(--line);width:40px;height:40px;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid .wd{font-size:12px;color:var(--mut);padding:4px 0}
.day{aspect-ratio:1;background:var(--card);border:1px solid var(--line);border-radius:10px;font-size:15px;position:relative}
.day.today{border-color:var(--acc);font-weight:800}
.day.sel{background:var(--acc);color:var(--accfg)}
.day i{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--warn)}
.day.sel i{background:var(--accfg)}
.day.off{visibility:hidden}
.calc{direction:ltr}
.disp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:right;margin-bottom:10px;min-height:96px}
.disp .ex{color:var(--mut);font-size:16px;min-height:24px;overflow-wrap:anywhere}
.disp .rs{font-size:36px;font-weight:800;overflow-wrap:anywhere}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.keys button{background:var(--card);border:1px solid var(--line);font-size:22px;padding:16px 0;font-weight:600}
.keys .op{background:var(--soft);color:var(--acc)}
.keys .eq{background:var(--acc);color:var(--accfg)}
.timer{text-align:center}
.clock{font-size:64px;font-weight:800;margin:10px 0;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;justify-content:center;margin-top:8px}
.row button{padding:10px 18px;background:var(--card);border:1px solid var(--line)}
nav{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;padding:10px 0 8px;color:var(--mut);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:0}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--acc);font-weight:800}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
section{display:none}section.on{display:block}
body{background:radial-gradient(800px 360px at 85% -8%,rgba(34,211,238,.14),transparent 70%),radial-gradient(600px 300px at 0% 0%,rgba(129,140,248,.12),transparent 70%),var(--bg);background-attachment:fixed}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brand b{font-size:20px;font-weight:800;display:block;line-height:1.1}
.brand small{color:var(--mut);font-size:12px}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:800;color:#04202a;background:linear-gradient(135deg,#22d3ee,#818cf8);box-shadow:0 0 18px rgba(34,211,238,.35)}
.card{border-radius:16px}
.btn,.keys .eq,.day.sel{background:linear-gradient(135deg,var(--acc),#818cf8);color:#04202a}
.bar i{background:linear-gradient(90deg,var(--acc),#818cf8)}
.ai-q{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chips button{background:var(--soft);color:var(--acc);border:1px solid var(--line);padding:9px 14px;font-weight:600}
#aiOut{white-space:pre-wrap;line-height:1.8;min-height:120px;overflow-wrap:anywhere}
.st{color:var(--mut);font-size:12px;margin-top:8px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header class="brand"><div class="logo">ن</div><div><b>نسق</b><small>رتّب وقتك ومهامك</small></div></header>
<section id="s-tasks" class="on">
  <h1>مهامي</h1><p class="sub" id="todayLbl"></p>
  <div class="bar"><i id="prog" style="width:0"></i></div>
  <div class="add card">
    <input type="text" id="tTitle" placeholder="اكتب مهمة جديدة" maxlength="120">
    <input type="date" id="tDate">
    <select id="tPri"><option value="1">عادية</option><option value="2">مهمة</option><option value="3">عاجلة</option></select>
    <button class="btn" id="tAdd" style="grid-column:1/-1">إضافة المهمة</button>
  </div>
  <div class="tabs" id="filters"><button data-f="today" class="on">اليوم</button><button data-f="open">المتبقية</button><button data-f="all">الكل</button></div>
  <div class="card" id="list"></div>
</section>

<section id="s-cal">
  <h1>التقويم</h1><p class="sub">اضغط على يوم لعرض مهامه وإضافة مهمة له</p>
  <div class="cal-h"><button id="nx" aria-label="الشهر التالي">›</button><b id="mLbl"></b><button id="pv" aria-label="الشهر السابق">‹</button></div>
  <div class="grid" id="grid"></div>
  <h2 style="font-size:16px;margin:16px 0 8px" id="dLbl"></h2>
  <div class="add card" style="margin-bottom:10px"><input type="text" id="cTitle" placeholder="مهمة لهذا اليوم" maxlength="120"><button class="btn" id="cAdd">إضافة</button></div>
  <div class="card" id="dayList"></div>
</section>

<section id="s-calc">
  <h1>الآلة الحاسبة</h1><p class="sub">&nbsp;</p>
  <div class="calc"><div class="disp"><div class="ex" id="ex"></div><div class="rs" id="rs">0</div></div>
  <div class="keys" id="keys"></div></div>
</section>

<section id="s-time">
  <h1>مؤقّت التركيز</h1><p class="sub">٢٥ دقيقة عمل ثم ٥ دقائق راحة</p>
  <div class="card timer"><div id="mode" style="color:var(--mut)">وقت العمل</div><div class="clock" id="clock">25:00</div>
  <div class="row"><button class="btn" id="go">ابدأ</button><button id="rst">إعادة</button><button id="swm">تبديل</button></div>
  <p class="sub" style="margin-top:14px" id="cnt">جلسات اليوم: 0</p></div>
</section>
<section id="s-ai"><h1>المساعد الذكي</h1><p class="sub">نموذج مجاني بدون مفتاح API</p>
<div class="chips"><button id="aiPlan">رتّب يومي</button><button id="aiSplit">قسّم مهمة</button></div>
<div class="ai-q"><input type="text" id="aiQ" placeholder="اكتب مهمة لتقسيمها أو اسأل عن تنظيم وقتك" maxlength="200"><button class="btn" id="aiAsk">اسأل</button></div>
<div class="card" id="aiOut">اضغط "رتّب يومي" وسأرتّب لك مهامك المتبقية.</div>
<button class="btn" id="aiAdd" hidden style="margin-top:10px;width:100%">أضف الخطوات كمهام لليوم</button>
<p class="st" id="aiSt"></p></section>
</main>

<nav>
  <button data-s="tasks" class="on"><span>✓</span>المهام</button>
  <button data-s="cal"><span>▦</span>التقويم</button>
  <button data-s="ai"><span>✦</span>المساعد</button>
  <button data-s="calc"><span>＋</span>الحاسبة</button>
  <button data-s="time"><span>◔</span>المؤقّت</button>
</nav>

<script>
const $=s=>document.querySelector(s);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=iso(new Date());
let tasks=[],filter='today',sel=today,view=new Date();view.setDate(1);
try{tasks=JSON.parse(localStorage.getItem('mn_tasks')||'[]')}catch(e){tasks=[]}
const save=()=>{try{localStorage.setItem('mn_tasks',JSON.stringify(tasks))}catch(e){}};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d+'T00:00').toLocaleDateString('ar-EG',{weekday:'long',day:'numeric',month:'long'});
const priCol={1:'var(--line)',2:'#e0a100',3:'var(--warn)'};

function addTask(title,date,pri){
  title=title.trim();if(!title)return false;
  tasks.push({id:Date.now()+Math.random(),title,date:date||today,pri:+pri||1,done:false});save();return true;
}
function taskHTML(t){
  const late=!t.done&&t.date<today;
  return `<div class="task ${t.done?'done':''}"><span class="pri" style="background:${priCol[t.pri]}"></span>
  <input type="checkbox" data-id="${t.id}" ${t.done?'checked':''} aria-label="تم">
  <div class="t">${esc(t.title)}<small class="${late?'late':''}">${late?'متأخرة · ':''}${fmt(t.date)}</small></div>
  <button class="del" data-del="${t.id}" aria-label="حذف">×</button></div>`;
}
function listHTML(arr,msg){return arr.length?arr.sort((a,b)=>a.done-b.done||a.date.localeCompare(b.date)||b.pri-a.pri).map(taskHTML).join(''):`<div class="empty">${msg}</div>`}

function renderTasks(){
  $('#todayLbl').textContent=fmt(today);
  const td=tasks.filter(t=>t.date===today),dn=td.filter(t=>t.done).length;
  $('#prog').style.width=(td.length?dn/td.length*100:0)+'%';
  let arr=tasks.filter(t=>filter==='today'?t.date===today||(!t.done&&t.date<today):filter==='open'?!t.done:true);
  $('#list').innerHTML=listHTML(arr,filter==='today'?'لا توجد مهام لليوم. أضف أول مهمة من الأعلى.':'لا توجد مهام هنا.');
}
function renderCal(){
  const y=view.getFullYear(),m=view.getMonth();
  $('#mLbl').textContent=view.toLocaleDateString('ar-EG',{month:'long',year:'numeric'});
  const names=['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'];
  let h=names.map(n=>`<div class="wd">${n}</div>`).join('');
  const lead=(new Date(y,m,1).getDay()+1)%7,days=new Date(y,m+1,0).getDate();
  for(let i=0;i<lead;i++)h+='<div class="day off"></div>';
  for(let d=1;d<=days;d++){
    const k=iso(new Date(y,m,d)),has=tasks.some(t=>t.date===k&&!t.done);
    h+=`<button class="day ${k===today?'today':''} ${k===sel?'sel':''}" data-d="${k}">${d}${has?'<i></i>':''}</button>`;
  }
  $('#grid').innerHTML=h;
  $('#dLbl').textContent=fmt(sel);
  $('#dayList').innerHTML=listHTML(tasks.filter(t=>t.date===sel),'لا توجد مهام في هذا اليوم.');
}
const render=()=>{renderTasks();renderCal()};

document.addEventListener('change',e=>{
  const id=e.target.dataset&&e.target.dataset.id;if(!id)return;
  const t=tasks.find(x=>String(x.id)===id);if(t){t.done=e.target.checked;save();render()}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.del){tasks=tasks.filter(t=>String(t.id)!==b.dataset.del);save();render()}
  else if(b.dataset.d){sel=b.dataset.d;renderCal()}
  else if(b.dataset.f){filter=b.dataset.f;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('on',x===b));renderTasks()}
  else if(b.dataset.s){document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+b.dataset.s));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));window.scrollTo(0,0)}
});
$('#tDate').value=today;
$('#tAdd').onclick=()=>{if(addTask($('#tTitle').value,$('#tDate').value,$('#tPri').value)){$('#tTitle').value='';render()}};
$('#tTitle').onkeydown=e=>{if(e.key==='Enter')$('#tAdd').click()};
$('#cAdd').onclick=()=>{if(addTask($('#cTitle').value,sel,1)){$('#cTitle').value='';render()}};
$('#cTitle').onkeydown=e=>{if(e.key==='Enter')$('#cAdd').click()};
$('#pv').onclick=()=>{view.setMonth(view.getMonth()-1);renderCal()};
$('#nx').onclick=()=>{view.setMonth(view.getMonth()+1);renderCal()};

/* Calculator */
let expr='';
const keys=['C','⌫','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','0','.','(',')','='];
$('#keys').innerHTML=keys.map(k=>`<button class="${'÷×−+%'.includes(k)?'op':''} ${k==='='?'eq':''}" style="${k==='='?'grid-column:1/-1':''}">${k}</button>`).join('');
function calc(s){
  const js=s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/(\d+\.?\d*)%/g,'($1/100)');
  if(!/^[0-9+\-*/.() ]+$/.test(js))return null;
  try{const r=Function('"use strict";return ('+js+')')();return isFinite(r)?+r.toFixed(10):null}catch(e){return null}
}
function showCalc(){const r=expr?calc(expr):null;$('#ex').textContent=expr;$('#rs').textContent=r===null?(expr?'…':'0'):r}
$('#keys').onclick=e=>{
  const k=e.target.closest('button');if(!k)return;const v=k.textContent;
  if(v==='C')expr='';else if(v==='⌫')expr=expr.slice(0,-1);
  else if(v==='='){const r=calc(expr);if(r!==null){expr=String(r);$('#ex').textContent='';$('#rs').textContent=expr;return}$('#rs').textContent='خطأ';return}
  else expr+=v;
  showCalc();
};

/* Focus timer */
let work=true,left=1500,iv=null,sessions=+(()=>{try{return localStorage.getItem('mn_s_'+today)||0}catch(e){return 0}})();
const drawT=()=>{$('#clock').textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('#mode').textContent=work?'وقت العمل':'وقت الراحة';$('#cnt').textContent='جلسات اليوم: '+sessions;$('#go').textContent=iv?'إيقاف مؤقت':'ابدأ'};
function stopT(){clearInterval(iv);iv=null}
function setMode(w){stopT();work=w;left=w?1500:300;drawT()}
$('#go').onclick=()=>{
  if(iv){stopT();drawT();return}
  iv=setInterval(()=>{left--;if(left<=0){if(work){sessions++;try{localStorage.setItem('mn_s_'+today,sessions)}catch(e){}}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}setMode(!work)}else drawT()},1000);drawT();
};
$('#rst').onclick=()=>setMode(work);
$('#swm').onclick=()=>setMode(!work);
/* AI assistant: free keyless model (works in the installed app) with offline fallback */
const AIURL='https://text.pollinations.ai/openai';
const ctx=()=>'اليوم '+today+'.\nالمهام المتبقية:\n'+(tasks.filter(t=>!t.done).map(t=>'- '+t.title+' ('+t.date+'، أولوية '+t.pri+')').join('\n')||'لا توجد');
async function ask(sys,user){
  const c=new AbortController(),to=setTimeout(()=>c.abort(),25000);
  try{
    const r=await fetch(AIURL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'system',content:sys},{role:'user',content:user}]}),signal:c.signal});
    if(!r.ok)throw new Error('http');
    const j=await r.json(),t=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
    if(!t)throw new Error('empty');return t;
  }finally{clearTimeout(to)}
}
function localPlan(){
  const o=tasks.filter(t=>!t.done&&t.date<=today).sort((a,b)=>b.pri-a.pri||a.date.localeCompare(b.date));
  if(!o.length)return 'مفيش مهام متبقية لليوم. أضف مهمة جديدة أو استمتع بوقتك.';
  return 'خطة مقترحة مرتبة بالأولوية والتأخير:\n'+o.map((t,i)=>(i+1)+'. '+t.title+(t.date<today?' (متأخرة)':'')+' — جلسة تركيز 25 دقيقة').join('\n')+'\n\nخد راحة 5 دقائق بين كل مهمتين.';
}
const localSplit=q=>'- حدّد الهدف النهائي من «'+q+'»\n- جهّز الأدوات والمعلومات المطلوبة\n- نفّذ الجزء الأول في جلسة 25 دقيقة\n- نفّذ الجزء الثاني بعد راحة قصيرة\n- راجع النتيجة وأنهِ المهمة';
let steps=[];
async function runAI(kind){
  const q=$('#aiQ').value.trim(),out=$('#aiOut');
  $('#aiAdd').hidden=true;steps=[];
  if(kind==='split'&&!q){out.textContent='اكتب المهمة اللي عايز تقسّمها في الخانة أعلاه.';return}
  if(kind==='ask'&&!q){out.textContent='اكتب سؤالك في الخانة أعلاه.';return}
  out.textContent='جاري التفكير…';
  const sys='أنت مساعد عربي لتنظيم الوقت والمهام. أجب بالعربية المصرية المبسطة وبإيجاز.';
  const p=kind==='plan'?ctx()+'\nرتّب لي خطة لليوم بترتيب منطقي مع تقدير الوقت لكل مهمة، في نقاط قصيرة.'
    :kind==='split'?'قسّم هذه المهمة إلى 4 إلى 6 خطوات صغيرة قابلة للتنفيذ، كل خطوة في سطر يبدأ بـ "- " وبدون أي مقدمة: '+q
    :ctx()+'\nسؤال المستخدم: '+q;
  let text,live=true;
  try{text=await ask(sys,p)}catch(e){live=false;text=kind==='plan'?localPlan():kind==='split'?localSplit(q):'تعذّر الاتصال بالنموذج الآن. جرّب "رتّب يومي" للحصول على خطة محلية.'}
  out.textContent=text;
  $('#aiSt').textContent=live?'الرد من نموذج مجاني عبر الإنترنت':'وضع محلي: تعذّر الوصول للنموذج (يعمل بعد تثبيت التطبيق مع الإنترنت)';
  if(kind==='split'){
    steps=text.split('\n').map(l=>l.replace(/^\s*(?:[-*•]|\d+[.)])\s*/,'').trim()).filter(Boolean).slice(0,8);
    $('#aiAdd').hidden=!steps.length;
  }
}
$('#aiPlan').onclick=()=>runAI('plan');
$('#aiSplit').onclick=()=>runAI('split');
$('#aiAsk').onclick=()=>runAI('ask');
$('#aiQ').onkeydown=e=>{if(e.key==='Enter')runAI('ask')};
$('#aiAdd').onclick=()=>{steps.forEach(s=>addTask(s,today,1));$('#aiAdd').hidden=true;render();$('#aiSt').textContent='تمت إضافة الخطوات إلى مهام اليوم'};

drawT();render();
</script>
</body>
</html>
